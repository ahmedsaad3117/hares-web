<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العملاء المحذوفين - Q1KEY Platform</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/i18n.js"></script>
    <style>
        .deleted-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .deleted-header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .deleted-icon {
            width: 56px;
            height: 56px;
            border-radius: 1rem;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(220, 38, 38, 0.3));
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .deleted-icon svg {
            color: #ef4444;
        }

        .deleted-title {
            color: white;
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0;
        }

        .deleted-subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin: 0.25rem 0 0;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 0.75rem;
            color: #818cf8;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateX(4px);
        }

        .stats-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .stat-card.warning {
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.1);
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-icon.red {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .search-section {
            margin-bottom: 1.5rem;
        }

        .search-container {
            position: relative;
        }

        .search-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 1rem 3rem 1rem 1rem;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            color: white;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .search-input::placeholder {
            color: #64748b;
        }

        .customer-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 1rem;
            padding: 1.25rem;
            transition: all 0.2s;
        }

        .customer-card:hover {
            border-color: rgba(239, 68, 68, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .customer-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .customer-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.25rem;
        }

        .customer-info {
            flex: 1;
        }

        .customer-name {
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0;
        }

        .customer-id {
            color: #94a3b8;
            font-size: 0.85rem;
            margin: 0;
        }

        .deletion-info {
            background: rgba(239, 68, 68, 0.1);
            border-radius: 0.5rem;
            padding: 0.75rem;
            margin-bottom: 1rem;
        }

        .deletion-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #fca5a5;
            padding: 0.25rem 0;
        }

        .deletion-label {
            opacity: 0.7;
        }

        .customer-details {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        .detail-row svg {
            color: #64748b;
            flex-shrink: 0;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn-restore {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            border-radius: 0.5rem;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-restore:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .btn-hard-delete {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border: none;
            border-radius: 0.5rem;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-hard-delete:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            grid-column: 1 / -1;
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .empty-icon svg {
            color: #22c55e;
        }

        .empty-title {
            color: #22c55e;
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 0.5rem;
        }

        .empty-text {
            color: #94a3b8;
            font-size: 1rem;
            margin: 0;
        }

        .customers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.25rem;
        }

        .loading-state {
            text-align: center;
            padding: 3rem;
            grid-column: 1 / -1;
        }

        .pagination-container {
            display: flex;
            justify-content: center;
            margin-top: 2rem;
        }
    </style>
</head>

<body>
    <div id="sidebar"></div>

    <div class="main-content">
        <div id="header"></div>

        <div class="page-content">
            <!-- Page Header -->
            <div class="deleted-header">
                <div class="deleted-header-left">
                    <div class="deleted-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18" />
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="deleted-title" data-i18n-key="customers.deleted_customers_title">العملاء المحذوفين
                        </h1>
                        <p class="deleted-subtitle" id="customerCount">جاري التحميل...</p>
                    </div>
                </div>
                <a href="customers.html" class="back-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5" />
                        <path d="M12 19l-7-7 7-7" />
                    </svg>
                    <span data-i18n-key="customers.show_active">العودة للعملاء النشطين</span>
                </a>
            </div>

            <!-- Search Section -->
            <div class="search-section glass-card p-4">
                <div class="search-container">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.35-4.35" />
                    </svg>
                    <input type="text" id="searchInput" class="search-input"
                        placeholder="البحث بالاسم أو رقم الهوية أو رقم الهاتف..." />
                </div>
            </div>

            <!-- Customers Grid -->
            <div id="customersGrid" class="customers-grid">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p style="color: #94a3b8; margin-top: 1rem;">جاري تحميل العملاء المحذوفين...</p>
                </div>
            </div>

            <!-- Pagination -->
            <div id="paginationContainer" class="pagination-container"></div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/ui-utils.js"></script>
    <script src="../components/sidebar.js?v=4"></script>
    <script src="../components/header.js"></script>
    <script src="../components/pagination.js"></script>
    <script>
        // Global variables
        let user = null;
        let allDeletedCustomers = [];
        let filteredCustomers = [];
        let currentPage = 1;
        let totalPages = 1;
        const pageSize = 12;
        let searchTimeout;

        // Initialize page
        async function initPage() {
            await waitForI18n();

            // Check authentication
            if (!isAuthenticated()) {
                window.location.href = '../index.html';
                return;
            }

            user = getCurrentUser();
            document.getElementById('sidebar').innerHTML = createSidebar(user);
            document.getElementById('header').innerHTML = createHeader(
                t('customers.deleted_customers_title') || 'العملاء المحذوفين',
                'إدارة العملاء المحذوفين'
            );
            initializeLanguageSwitcher();
            setActiveNav('customers');

            // Translate static content
            window.i18n.translatePage();

            // Load deleted customers
            await loadDeletedCustomers();

            // Setup search
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', () => {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(performSearch, 300);
                });
            }
        }

        // Load deleted customers
        async function loadDeletedCustomers(page = 1) {
            const grid = document.getElementById('customersGrid');
            const countText = document.getElementById('customerCount');

            // Show loading
            grid.innerHTML = `
        <div class="loading-state">
          <div class="spinner"></div>
          <p style="color: #94a3b8; margin-top: 1rem;">جاري تحميل العملاء المحذوفين...</p>
        </div>
      `;

            try {
                const response = await api.customers.getAll(page, pageSize, true);
                allDeletedCustomers = response.data;
                filteredCustomers = [...allDeletedCustomers];
                currentPage = response.meta.page;
                totalPages = response.meta.totalPages;

                const totalCount = response.meta.total || allDeletedCustomers.length;
                countText.textContent = `${totalCount} عميل محذوف`;

                renderCustomers(filteredCustomers);
            } catch (error) {
                console.error('Error loading deleted customers:', error);
                countText.textContent = 'خطأ في التحميل';
                grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon" style="background: rgba(239, 68, 68, 0.1);">
              <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
            </div>
            <h3 style="color: #ef4444; font-size: 1.25rem; margin-bottom: 0.5rem;">فشل في التحميل</h3>
            <p class="empty-text">حدث خطأ أثناء تحميل العملاء المحذوفين</p>
            <button onclick="loadDeletedCustomers()" class="btn btn-primary" style="margin-top: 1rem;">إعادة المحاولة</button>
          </div>
        `;
            }
        }

        // Search functionality
        function performSearch() {
            const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();

            if (!searchTerm) {
                filteredCustomers = [...allDeletedCustomers];
            } else {
                filteredCustomers = allDeletedCustomers.filter(customer => {
                    return customer.name.toLowerCase().includes(searchTerm) ||
                        customer.nationalId.includes(searchTerm) ||
                        customer.phoneNumber.includes(searchTerm);
                });
            }

            renderCustomers(filteredCustomers);

            // Update count
            document.getElementById('customerCount').textContent =
                searchTerm ? `${filteredCustomers.length} نتيجة بحث` : `${allDeletedCustomers.length} عميل محذوف`;
        }

        // Render customers
        function renderCustomers(customers) {
            const grid = document.getElementById('customersGrid');

            if (customers.length === 0) {
                const searchTerm = document.getElementById('searchInput').value.trim();
                grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
            </div>
            <h3 class="empty-title">${searchTerm ? 'لم يتم العثور على نتائج' : 'لا يوجد عملاء محذوفين'}</h3>
            <p class="empty-text">${searchTerm ? 'جرب البحث بكلمات مختلفة' : 'جميع العملاء نشطين في النظام'}</p>
          </div>
        `;
                // Clear pagination
                document.getElementById('paginationContainer').innerHTML = '';
                return;
            }

            const customersHTML = customers.map(customer => `
        <div class="customer-card">
          <div class="customer-header">
            <div class="customer-avatar">
              ${customer.name.charAt(0).toUpperCase()}
            </div>
            <div class="customer-info">
              <h3 class="customer-name">${customer.name}</h3>
              <p class="customer-id">ID: ${customer.customerId}</p>
            </div>
          </div>

          <div class="deletion-info">
            <div class="deletion-row">
              <span class="deletion-label">حذف بواسطة:</span>
              <span>${customer.deletedByName || 'غير معروف'}</span>
            </div>
            <div class="deletion-row">
              <span class="deletion-label">تاريخ الحذف:</span>
              <span>${formatDate(customer.deletedAt)}</span>
            </div>
            <div class="deletion-row">
              <span class="deletion-label">الفرع:</span>
              <span>${customer.branchName || '-'}</span>
            </div>
          </div>

          <div class="customer-details">
            <div class="detail-row">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="M7 15h0M2 9.5h20"/>
              </svg>
              <span>${customer.nationalId}</span>
            </div>
            <div class="detail-row">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
              </svg>
              <span>${customer.phoneNumber}</span>
            </div>
          </div>

          <div class="action-buttons">
            <button onclick="restoreCustomer(${customer.customerId})" class="btn-restore">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="1 4 1 10 7 10"/>
                <polyline points="23 20 23 14 17 14"/>
                <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
              </svg>
              استعادة
            </button>
            ${(user && user.roleName === 'Super Admin') ? `
              <button onclick="hardDeleteCustomer(${customer.customerId})" class="btn-hard-delete">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 6h18"/>
                  <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                  <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                </svg>
                حذف نهائي
              </button>
            ` : ''}
          </div>
        </div>
      `).join('');

            grid.innerHTML = customersHTML;

            // Render pagination
            const paginationContainer = document.getElementById('paginationContainer');
            if (paginationContainer && totalPages > 1) {
                paginationContainer.innerHTML = createPagination(currentPage, totalPages, changePage);
            } else {
                paginationContainer.innerHTML = '';
            }
        }

        // Change page
        function changePage(page) {
            if (page < 1 || page > totalPages || page === currentPage) return;
            loadDeletedCustomers(page);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Restore customer
        window.restoreCustomer = function (id) {
            const customer = allDeletedCustomers.find(c => c.customerId === id);
            const name = customer ? customer.name : 'العميل';

            showConfirmModal({
                title: 'استعادة العميل',
                message: 'هل أنت متأكد من استعادة هذا العميل؟ سيعود لقائمة العملاء النشطين.',
                subMessage: name,
                confirmText: 'استعادة',
                icon: '↺',
                btnClass: 'btn-success',
                onConfirm: async () => {
                    try {
                        await api.customers.restore(id);
                        showToast('تم استعادة العميل بنجاح', 'success');
                        await loadDeletedCustomers(currentPage);
                    } catch (error) {
                        console.error('Error restoring customer:', error);
                        showToast(error.message || 'فشل في استعادة العميل', 'error');
                    }
                }
            });
        };

        // Hard delete customer
        window.hardDeleteCustomer = function (id) {
            const customer = allDeletedCustomers.find(c => c.customerId === id);
            const name = customer ? customer.name : 'العميل';

            showDeleteModal({
                title: 'حذف نهائي',
                itemName: name,
                warningText: 'تحذير: سيتم حذف العميل وجميع البيانات المرتبطة نهائياً.\nلا يمكن التراجع عن هذا الإجراء.',
                confirmText: 'نعم، حذف نهائي',
                onConfirm: async () => {
                    try {
                        await api.customers.delete(id);
                        showToast('تم حذف العميل نهائياً', 'success');
                        await loadDeletedCustomers(currentPage);
                    } catch (error) {
                        console.error('Error deleting customer:', error);
                        showToast(error.message || 'فشل في الحذف', 'error');
                    }
                }
            });
        };

        // Start
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }
    </script>
</body>

</html>
