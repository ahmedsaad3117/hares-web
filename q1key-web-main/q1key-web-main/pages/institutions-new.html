<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Institution - Q1KEY Platform</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/i18n.js"></script>
</head>

<body>
  <div id="sidebar"></div>

  <div class="main-content">
    <div id="header"></div>

    <div class="page-content">
      <!-- Page Header -->
      <div class="flex items-center gap-3 mb-8"
        style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem;">
        <a href="institutions.html" class="btn btn-secondary" style="padding: 0.5rem;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12" />
            <polyline points="12 19 5 12 12 5" />
          </svg>
        </a>
        <div>
          <h1 class="text-3xl font-bold text-white" data-i18n-key="institutions.add_institution">Add Institution</h1>
          <p class="text-secondary" data-i18n-key="institutions.create_new_institution">Create a new institution</p>
        </div>
      </div>

      <!-- Main Grid Layout -->
      <form id="institutionForm" class="grid gap-6"
        style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 1.5rem; max-width: 1400px; margin: 0 auto;">

        <!-- Left Column: Institution Details -->
        <div class="glass-card p-6 h-full">
          <h3 class="text-xl font-bold text-white mb-6 flex items-center gap-2">
            <span style="font-size: 1.5rem;">🏢</span>
            <span data-i18n-key="institutions.form.institution_info">Institution Information</span>
          </h3>

          <div class="space-y-4" style="display: flex; flex-direction: column; gap: 1rem;">
            <!-- Name -->
            <div class="form-group">
              <label class="label" data-i18n-key="institutions.form.name_label">Institution Name</label> <span
                data-i18n-key="institutions.form.name_required" style="color: red">*</span>
              <input type="text" id="name" name="name" class="input"
                data-i18n-placeholder="institutions.form.name_placeholder" placeholder="Enter institution name"
                required />
              <div id="nameError" class="error-text hidden"></div>
            </div>

            <!-- Tax ID -->
            <div class="form-group">
              <label class="label" data-i18n-key="institutions.form.tax_id_label">Commercial Registration No.</label>
              <span style="color: #ef4444;">*</span>
              <input type="text" id="taxId" name="taxId" class="input"
                data-i18n-placeholder="institutions.form.tax_id_placeholder" placeholder="Enter CR number" required />
              <div id="taxIdError" class="error-text hidden"></div>
            </div>

            <div class="grid grid-cols-2 gap-4" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
              <!-- Phone -->
              <div class="form-group">
                <label class="label" data-i18n-key="institutions.form.phone_label">Phone</label> <span
                  style="color: #ef4444;">*</span>
                <input type="tel" id="phoneNumber" name="phoneNumber" class="input"
                  data-i18n-placeholder="institutions.form.phone_placeholder" placeholder="Phone" required />
                <div id="phoneNumberError" class="error-text hidden"></div>
              </div>
              <!-- Email -->
              <div class="form-group">
                <label class="label" data-i18n-key="institutions.form.email_label">Email</label> <span
                  style="color: #ef4444;">*</span>
                <input type="email" id="email" name="email" class="input"
                  data-i18n-placeholder="institutions.form.email_placeholder" placeholder="Email" required />
                <div id="emailError" class="error-text hidden"></div>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
              <!-- Max Users -->
              <div class="form-group">
                <label class="label" data-i18n-key="institutions.form.max_users_label">Max Users</label> <span
                  data-i18n-key="institutions.form.max_users_required" style="color: red">*</span>
                <input type="number" id="maxUsers" name="maxUsers" class="input" min="1" value="1" required />
                <div id="maxUsersError" class="error-text hidden"></div>
              </div>
              <!-- Expiration Date -->
              <div class="form-group">
                <label class="label" data-i18n-key="institutions.form.expiration_date_label">Expiration</label>
                <input type="date" id="expirationDate" name="expirationDate" class="input" />
                <div id="expirationDateError" class="error-text hidden"></div>
              </div>
            </div>

            <!-- Toggles -->
            <div class="flex flex-col gap-3 mt-2"
              style="background: rgba(255,255,255,0.03); padding: 1rem; border-radius: 8px;">
              <label class="flex items-center gap-3 cursor-pointer">
                <input type="checkbox" id="canCreateBranches" name="canCreateBranches" checked
                  style="width: 18px; height: 18px; accent-color: #6366f1;">
                <div>
                  <span class="label block" style="margin: 0;"
                    data-i18n-key="institutions.form.can_create_branches_label">Allow Branch Creation</span>
                  <span class="text-xs text-secondary" data-i18n-key="institutions.form.can_create_branches_help">Allow
                    creating child branches</span>
                </div>
              </label>
              <label class="flex items-center gap-3 cursor-pointer">
                <input type="checkbox" id="isActive" name="isActive" checked
                  style="width: 18px; height: 18px; accent-color: #10b981;">
                <span class="label" style="margin: 0;" data-i18n-key="institutions.form.active_label">Institution
                  Active</span>
              </label>
            </div>
          </div>
        </div>

        <!-- Right Column: Manager & Subscription -->
        <div class="space-y-6" style="display: flex; flex-direction: column; gap: 1.5rem;">

          <!-- Subscription Plan -->
          <div class="glass-card p-6">
            <h3 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
              <span style="font-size: 1.5rem;">💎</span>
              <span data-i18n-key="institutions.form.plan_section_title">Subscription Plan</span>
            </h3>
            <div id="plansContainer" style="display: flex; flex-wrap: wrap; gap: 0.75rem;">
              <div class="spinner"></div>
            </div>
            <input type="hidden" id="selectedPlanId" name="planId" required>
            <div id="planError" class="error-text hidden mt-2"></div>
          </div>

          <!-- Manager Account -->
          <div class="glass-card p-6">
            <h3 class="text-xl font-bold text-white mb-6 flex items-center gap-2">
              <span style="font-size: 1.5rem;">👤</span>
              <span data-i18n-key="institutions.form.admin_section_title">Manager Account</span>
            </h3>

            <div class="space-y-4" style="display: flex; flex-direction: column; gap: 1rem;">
              <div class="form-group">
                <label class="label" data-i18n-key="users.form.full_name">Admin Name</label> <span
                  style="color: #ef4444;">*</span>
                <input type="text" id="adminName" name="adminName" class="input"
                  data-i18n-placeholder="users.form.full_name_placeholder" placeholder="Full Name" required />
              </div>

              <div class="form-group">
                <label class="label" data-i18n-key="users.form.email_label">Admin Email</label> <span
                  style="color: #ef4444;">*</span>
                <input type="email" id="adminEmail" name="adminEmail" class="input"
                  data-i18n-placeholder="users.form.email_placeholder" placeholder="Email" required />
              </div>

              <div class="grid grid-cols-2 gap-4" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                  <label class="label" data-i18n-key="users.form.password">Password</label> <span
                    style="color: #ef4444;">*</span>
                  <div style="position: relative;">
                    <input type="password" id="adminPassword" name="adminPassword" class="input" placeholder="Password"
                      minlength="6" required style="padding-inline-end: 2.5rem;" />
                    <button type="button" id="toggleAdminPassword"
                      style="position: absolute; inset-inline-end: 0; top: 0; height: 100%; padding: 0 0.75rem; background: none; border: none; cursor: pointer; color: #a5b4fc;">
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="eye-icon">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                      </svg>
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="eye-off-icon hidden" style="display: none;">
                        <path
                          d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                        </path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                      </svg>
                    </button>
                  </div>
                </div>
                <div class="form-group">
                  <label class="label" data-i18n-key="users.form.phone_label">Phone</label>
                  <input type="tel" id="adminPhoneNumber" name="adminPhoneNumber" class="input" placeholder="Phone" />
                </div>
              </div>
              <div class="form-group">
                <label class="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" id="adminIsActive" name="adminIsActive" checked
                    style="width: 16px; height: 16px;">
                  <span class="label" style="margin: 0;" data-i18n-key="users.form.active_label">Admin Active</span>
                </label>
              </div>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="glass-card p-4 flex items-center justify-end gap-3 border-t border-white/10">
            <div id="errorMessage"
              class="hidden mr-auto text-sm text-red-400 px-3 py-1 rounded bg-red-500/10 border border-red-500/20">
              <p></p>
            </div>

            <a href="institutions.html" class="btn btn-secondary px-6"
              data-i18n-key="institutions.form.cancel">Cancel</a>
            <button type="submit" id="submitButton"
              class="btn btn-primary px-8 shadow-lg shadow-primary/20 hover:shadow-primary/40 transition-all">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2">
                <polyline points="20 6 9 17 4 12" />
              </svg>
              <span data-i18n-key="institutions.form.create_institution">Create Institution</span>
            </button>
          </div>

        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../components/sidebar.js?v=4"></script>
  <script src="../components/header.js"></script>
  <script>
    async function initPage() {
      await waitForI18n();

      if (!isAuthenticated()) {
        window.location.href = '../index.html';
        return;
      }

      const user = getCurrentUser();
      document.getElementById('sidebar').innerHTML = createSidebar(user);
      document.getElementById('header').innerHTML = createHeader(
        t('institutions.add_institution'),
        t('institutions.create_new_institution')
      );
      initializeLanguageSwitcher();
      setActiveNav('institutions');
      window.i18n.translatePage();

      // Load Subscription Plans
      loadSubscriptionPlans();

      const form = document.getElementById('institutionForm');
      const submitButton = document.getElementById('submitButton');
      const errorMessage = document.getElementById('errorMessage');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Clear errors
        errorMessage.classList.add('hidden');
        document.getElementById('nameError').classList.add('hidden');
        document.getElementById('maxUsersError').classList.add('hidden');

        // Get form data
        const formData = {
          name: document.getElementById('name').value.trim(),
          maxUsers: parseInt(document.getElementById('maxUsers').value) || 0,
          canCreateBranches: document.getElementById('canCreateBranches').checked,
          isActive: document.getElementById('isActive').checked,
          planId: parseInt(document.getElementById('selectedPlanId').value)
        };

        // Mandatory fields checks
        const taxId = document.getElementById('taxId').value.trim();
        const phoneNumber = document.getElementById('phoneNumber').value.trim();
        const email = document.getElementById('email').value.trim();
        const adminName = document.getElementById('adminName').value.trim();
        const adminEmail = document.getElementById('adminEmail').value.trim();
        const adminPassword = document.getElementById('adminPassword').value;
        const adminPhoneNumber = document.getElementById('adminPhoneNumber').value.trim();

        if (!formData.name || !taxId || !phoneNumber || !email || !adminName || !adminEmail || !adminPassword) {
          errorMessage.querySelector('p').textContent = t('users.form.inline_error') || 'Please fill in all required fields';
          errorMessage.classList.remove('hidden');
          // Also show specific field errors if possible, or just rely on the general message
          if (!formData.name) {
            document.getElementById('nameError').textContent = t('institutions.form.name_required') || 'Institution name is required';
            document.getElementById('nameError').classList.remove('hidden');
          }
          return;
        }



        if (!formData.planId || isNaN(formData.planId)) {
          document.getElementById('planError').textContent = t('institutions.form.plan_required') || 'Please select a subscription plan';
          document.getElementById('planError').classList.remove('hidden');
          return;
        }

        if (adminPassword.length < 6) {
          errorMessage.querySelector('p').textContent = t('users.form.password_min_error');
          errorMessage.classList.remove('hidden');
          return;
        }

        formData.taxId = taxId;
        formData.phoneNumber = phoneNumber;
        formData.email = email;

        formData.adminName = adminName;
        formData.adminEmail = adminEmail;
        formData.adminPassword = adminPassword;
        formData.adminPhoneNumber = adminPhoneNumber;
        formData.adminIsActive = document.getElementById('adminIsActive').checked;

        // Validation
        let hasError = false;

        if (formData.name.length < 2) {
          document.getElementById('nameError').textContent = t('institutions.form.name_error');
          document.getElementById('nameError').classList.remove('hidden');
          hasError = true;
        }

        if (formData.maxUsers < 1) {
          document.getElementById('maxUsersError').textContent = t('institutions.form.max_users_error');
          document.getElementById('maxUsersError').classList.remove('hidden');
          hasError = true;
        }

        if (hasError) return;

        // Disable submit button
        submitButton.disabled = true;
        submitButton.innerHTML = `<div class="spinner" style="width: 20px; height: 20px; border-width: 2px;"></div> ${t('institutions.form.creating')}`;

        try {
          await api.institutions.create(formData);
          showToast(t('common.message.request_created_success') || 'تم تقديم طلب التسجيل بنجاح', 'success');
          setTimeout(() => {
            window.location.href = 'requests.html';
          }, 1500);
        } catch (error) {
          console.error('Error creating institution:', error);
          errorMessage.querySelector('p').textContent = error.message || 'Failed to create institution';
          errorMessage.classList.remove('hidden');

          // Scroll to error
          errorMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });

          // Re-enable button
          submitButton.disabled = false;
          submitButton.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span data-i18n-key="institutions.form.create_institution">${t('institutions.form.create_institution')}</span>
        `;
        }
      });
      // Toggle Password Visibility Logic
      const togglePasswordBtn = document.getElementById('toggleAdminPassword');
      const passwordInput = document.getElementById('adminPassword');

      if (togglePasswordBtn && passwordInput) {
        togglePasswordBtn.addEventListener('click', () => {
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);

          const eyeIcon = togglePasswordBtn.querySelector('.eye-icon');
          const eyeOffIcon = togglePasswordBtn.querySelector('.eye-off-icon');

          if (type === 'password') {
            eyeIcon.style.display = 'block';
            eyeOffIcon.style.display = 'none';
            togglePasswordBtn.style.color = '#a5b4fc';
          } else {
            eyeIcon.style.display = 'none';
            eyeOffIcon.style.display = 'block';
            togglePasswordBtn.style.color = '#fff';
          }
        });
      }
    }

    async function loadSubscriptionPlans() {
      const container = document.getElementById('plansContainer');
      try {
        const response = await api.subscriptions.getPlans(); // Assuming this endpoint exists or will be created
        const plans = Array.isArray(response) ? response : (response.data || []);

        if (plans.length === 0) {
          container.innerHTML = `<p class="text-muted">${t('institutions.form.no_plans') || 'No subscription plans available.'}</p>`;
          return;
        }

        container.innerHTML = plans.map(plan => `
                <div class="plan-card glass-card p-3 items-center gap-2 cursor-pointer transition-all duration-200 border border-white/10 hover:border-primary flex-1 min-w-[140px]" 
                     onclick="selectPlan(this, ${plan.id})"
                     style="border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; text-align: center; min-width: 140px;">
                    <h4 class="font-bold text-base mb-1 text-white">${i18n.isRTL() ? plan.name : (plan.nameEn || plan.name)}</h4>
                    <div class="text-xl font-bold text-primary mb-1">${plan.price} ${t('my_subscription.currency')}</div>
                    <div class="text-xs text-muted">${plan.durationMonths} ${plan.durationMonths > 1 ? t('my_subscription.months') : t('my_subscription.month')}</div>
                    ${plan.description ? `<p class="text-[10px] text-muted mt-1 truncate">${plan.description}</p>` : ''}
                </div>
            `).join('');

      } catch (error) {
        console.error('Error loading plans:', error);
        container.innerHTML = `<p class="text-red-500">${t('institutions.form.load_plans_error') || 'Failed to load plans.'}</p>`;
      }
    }

    window.selectPlan = function (element, planId) {
      // Remove active class from all
      document.querySelectorAll('.plan-card').forEach(card => {
        card.style.borderColor = 'rgba(255,255,255,0.1)';
        card.style.background = 'rgba(255,255,255,0.05)';
      });

      // Add active style to selected
      element.style.borderColor = '#6366f1'; // Primary color
      element.style.background = 'rgba(99, 102, 241, 0.1)';

      // Set value
      document.getElementById('selectedPlanId').value = planId;
      document.getElementById('planError').classList.add('hidden');
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPage);
    } else {
      initPage();
    }
  </script>
</body>

</html>
